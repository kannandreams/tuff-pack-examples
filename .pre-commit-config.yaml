default_install_hook_types: [pre-commit]

repos:
  # Generic secret detection. GitHub's free secret scanning covers known
  # provider formats only; non-provider patterns and validity checks need
  # Secret Protection on a paid plan. This catches the generic cases locally,
  # before a commit exists. --redact means a hit is reported without echoing
  # the secret into the terminal or a CI log.
  #
  # The security-review example contains credential-shaped documentation
  # fixtures — AWS's own AKIAIOSFODNN7EXAMPLE, a bare PEM header, an sk-ant
  # detection regex. None of them trip this hook, so no allowlist is needed.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
