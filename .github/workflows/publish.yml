name: Publish pack to GHCR

on:
  push:
    tags:
      - "csv-data-quality-v*"
      - "security-review-v*"

permissions:
  contents: read
  packages: write

env:
  TUFF_VERSION: "0.1.4"

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install pinned Tuff CLI
        shell: bash
        run: |
          set -euo pipefail
          asset=tuff-x86_64-unknown-linux-gnu.tar.gz
          base="https://github.com/kannandreams/tuff/releases/download/v${TUFF_VERSION}"
          curl --fail --silent --show-error --location --output "$asset" "$base/$asset"
          curl --fail --silent --show-error --location --output checksums.txt "$base/checksums.txt"
          grep "  ${asset}$" checksums.txt | sha256sum --check --strict
          tar -xzf "$asset"
          chmod +x tuff
          ./tuff --version

      - name: Resolve release tag
        id: release
        shell: bash
        run: |
          set -euo pipefail
          case "$GITHUB_REF_NAME" in
            csv-data-quality-v*) pack=csv-data-quality; version="${GITHUB_REF_NAME#csv-data-quality-v}" ;;
            security-review-v*) pack=security-review; version="${GITHUB_REF_NAME#security-review-v}" ;;
            *) echo "unsupported release tag: $GITHUB_REF_NAME" >&2; exit 2 ;;
          esac
          manifest_version=$(sed -n 's/^version = "\([^"]*\)"$/\1/p' "packs/$pack/tuff-pack.toml" | head -n 1)
          test "$version" = "$manifest_version" || { echo "tag version $version does not match pack version $manifest_version" >&2; exit 2; }
          owner=$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          echo "pack=$pack" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "artifact=.work/artifacts/$pack-$version.tuffpack" >> "$GITHUB_OUTPUT"
          echo "registry_ref=ghcr.io/$owner/tuff-pack-examples:$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"

      - name: Build and verify
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .work/artifacts
          ./tuff pack check "packs/${{ steps.release.outputs.pack }}"
          ./tuff pack build "packs/${{ steps.release.outputs.pack }}" --output "${{ steps.release.outputs.artifact }}"
          ./tuff pack verify "${{ steps.release.outputs.artifact }}"

      - name: Authenticate to GHCR
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Push and capture immutable reference
        id: push
        shell: bash
        run: |
          set -euo pipefail
          ./tuff pack push "${{ steps.release.outputs.artifact }}" "${{ steps.release.outputs.registry_ref }}" --json > .work/artifacts/push.json
          immutable_ref=$(python3 -c 'import json; print(json.load(open(".work/artifacts/push.json", encoding="utf-8"))["reference"])')
          case "$immutable_ref" in *@sha256:*) ;; *) echo "push did not return a digest reference" >&2; exit 1 ;; esac
          echo "immutable_ref=$immutable_ref" >> "$GITHUB_OUTPUT"

      - name: Pull by digest and verify exact bytes
        shell: bash
        run: |
          set -euo pipefail
          ./tuff pack pull "${{ steps.push.outputs.immutable_ref }}" --output .work/artifacts/pulled.tuffpack --json > .work/artifacts/pull.json
          cmp "${{ steps.release.outputs.artifact }}" .work/artifacts/pulled.tuffpack
          ./tuff pack verify .work/artifacts/pulled.tuffpack
          ./tuff pack extract .work/artifacts/pulled.tuffpack --agent claude --output .work/artifacts/runtime

      - name: Upload release evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.release.outputs.pack }}-${{ steps.release.outputs.version }}
          if-no-files-found: error
          path: |
            ${{ steps.release.outputs.artifact }}
            .work/artifacts/push.json
            .work/artifacts/pull.json
            .work/artifacts/runtime
