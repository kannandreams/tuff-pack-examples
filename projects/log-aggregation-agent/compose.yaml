services:
  agent:
    build: .
    working_dir: /workspace
    environment:
      PROJECT_ROOT: /workspace
      OPENAI_API_KEY_FILE: /run/secrets/openai_api_key
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.1}
    secrets:
      - openai_api_key
    volumes:
      - ./reports:/workspace/reports

secrets:
  openai_api_key:
    file: ${OPENAI_API_KEY_FILE:?Set OPENAI_API_KEY_FILE to a key file outside the repository}
