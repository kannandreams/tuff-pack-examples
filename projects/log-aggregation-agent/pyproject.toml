[project]
name = "log-aggregation-agent"
version = "0.1.0"
description = "A Tuff-packaged log aggregation agent demo"
requires-python = ">=3.12"
dependencies = [
  "openai-agents>=0.2.0",
  "rich>=14.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["log_aggregation", "runtime"]
